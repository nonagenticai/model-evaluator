services:
  model-evaluator:
    environment:
      MODEL_EVALUATOR_LOG_LEVEL: DEBUG
      MODEL_EVALUATOR_LOG_FORMAT: console
      MODEL_EVALUATOR_ENVIRONMENT: development
      MODEL_EVALUATOR_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/model_evaluator
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    container_name: model-evaluator-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: model_evaluator
    ports:
      - "5452:5432"
    volumes:
      - model_evaluator_db_data:/var/lib/postgresql/data

volumes:
  model_evaluator_db_data:
