[alembic]
script_location = alembic
prepend_sys_path = src
# No DSN here, on purpose: a localhost default silently hits whatever runs on that
# port on a dev box. env.py reads MODEL_EVALUATOR_DATABASE_URL / DATABASE_URL and raises if unset. Offline
# commands that do not run env.py (`alembic heads` / `history`) need no DSN.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
